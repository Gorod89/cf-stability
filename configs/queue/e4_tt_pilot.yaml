# Pilot of the two-timescale certified hybrid (docs/m11_contract.md, D129): residual_idm_tt on follownet_highd,
# fold 0, seed 0, at the latent time constants tau_z = 15, 30 and 60 s; otherwise the recipe of e4_stable
# (configs/queue/e4.yaml): IDM core with string-stability margin 0.2, r_max 0.3, residual budget certified a priori
# (here over every frozen latent the online latent can reach). tau_z is then chosen by the rule of D129 from the
# validation RMSE and the audits at frozen z in {-1, -0.5, 0, 0.5, 1} (scripts/audit_stability.py frozen_z=<z>,
# run after this queue).
# python scripts/run_experiment.py configs/queue/e4_tt_pilot.yaml
name: e4_tt_pilot
workers: 2
timeout_h: 4.0
min_free_ram_gb: 6.0
order: [experiment, seed, fold, model]
steps: [train, audit, platoon, certificate]
groups:
  - experiment: "e4_tt_pilot_tau{model.tau_z:g}"
    overrides:
      data: [follownet_highd]
      model: [residual_idm_tt]
      model.tau_z: [15.0, 30.0, 60.0]
      fold: [0]
      seed: [0]
    fixed:
      calibration.stability_margin: 0.2
      certificate.enforce: true
      model.r_max: 0.3
