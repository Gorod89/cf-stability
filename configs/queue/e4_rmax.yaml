# Residual-amplitude sweep of the certified hybrid (docs/m7_contract.md, section 4; D111): E4 repeated at
# r_max = 0.1, 0.2 and 0.5 m/s^2, five folds x five seeds each, and a control that separates the amplitude
# from the certificate. 200 runs; the existing runs of configs/queue/e4.yaml are the points r_max = 0.3
# (e4_stable, e4_stable_ft) and the free core with r_max = 1.0 (e4_free_ft).
#   e4_stable_r{r}     ResidualIDM, IDM core with string-stability margin 0.2, residual budget certified a priori
#                      at r_max = r (lipschitz = 0.9 x admissible budget / r_max, D86), as e4_stable at 0.3
#   e4_stable_ft_r{r}  e4_stable_r{r} fine-tuned on ngsim_i80 (core, scaler and certified residual kept)
#   e4_free_r0.3       ResidualIDM with the free core of E1 (no margin), no certificate (lipschitz 1 of the
#                      model config, as E1), r_max = 0.3
#   e4_free_r0.3_ft    e4_free_r0.3 fine-tuned on ngsim_i80
# The HighD runs come first, their fine-tuning after them (a job whose init_from has no model.pt yet waits
# at the end of the queue). The init_from paths assume paths.runs_root=runs.
# python scripts/run_experiment.py configs/queue/e4_rmax.yaml
name: e4_rmax
workers: 2
timeout_h: 4.0
min_free_ram_gb: 6.0
order: [data, seed, fold, experiment]   # follownet_highd before ngsim_i80: every source before its fine-tuning
steps: [train, audit, certificate]
groups:
  - experiment: "e4_stable_r{model.r_max:g}"
    overrides:
      data: [follownet_highd]
      model: [residual_idm]
      model.r_max: [0.1, 0.2, 0.5]
      fold: [0, 1, 2, 3, 4]
      seed: [0, 1, 2, 3, 4]
    fixed:
      calibration.stability_margin: 0.2
      certificate.enforce: true
  - experiment: "e4_stable_ft_r{model.r_max:g}"
    overrides:
      data: [ngsim_i80]
      model: [residual_idm]
      model.r_max: [0.1, 0.2, 0.5]   # as the checkpoint (the checkpoint decides; the config records it)
      fold: [0, 1, 2, 3, 4]
      seed: [0, 1, 2, 3, 4]
    fixed:
      init_from: "runs/e4_stable_r{model.r_max:g}/follownet_highd/residual_idm/driver_fold{fold}_seed{seed}"
  - experiment: e4_free_r0.3
    overrides:
      data: [follownet_highd]
      model: [residual_idm]
      fold: [0, 1, 2, 3, 4]
      seed: [0, 1, 2, 3, 4]
    fixed:
      certificate.enforce: false   # the default, stated: free core (no calibration.stability_margin), lipschitz 1
      model.r_max: 0.3
  - experiment: e4_free_r0.3_ft
    overrides:
      data: [ngsim_i80]
      model: [residual_idm]
      fold: [0, 1, 2, 3, 4]
      seed: [0, 1, 2, 3, 4]
    fixed:
      init_from: "runs/e4_free_r0.3/follownet_highd/residual_idm/driver_fold{fold}_seed{seed}"
      model.r_max: 0.3        # as the checkpoint (the checkpoint decides; the config records it)
